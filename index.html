le + sortie si le range casse","SL global : sortie si le range casse franchement"],"En tendance forte, une grille peut accumuler de grosses pertes. Plafonne toujours la taille totale et le risque maximal."],["News Trading NFP","Avanc\xE9","M1 / M5",51,"1 : 2","Le NFP cr\xE9e les plus gros mouvements du mois : on trade la r\xE9action, jamais l\u2019annonce elle-m\xEAme.",["Attendre la publication du NFP","Laisser passer la premi\xE8re bougie de panique","Entr\xE9e sur le retest / la structure qui se forme apr\xE8s"],["TP \xE0 2R ou sortie rapide","SL serr\xE9 derri\xE8re la structure post-annonce"],"Volatilit\xE9 extr\xEAme, spreads \xE9largis, slippage possible. Taille r\xE9duite, ou reste \xE0 l\u2019\xE9cart."],["Martingale","Avanc\xE9","M5",45,"1 : 1","Doubler apr\xE8s chaque perte pour r\xE9cup\xE9rer : la m\xE9thode la plus dangereuse de cette biblioth\xE8que.",["S\xE9rie de pertes qui d\xE9clenche le doublement","Taille doubl\xE9e \xE0 chaque trade suivant","Aucune limite de capital pr\xE9vue par la m\xE9thode classique"],["Sortie si la s\xE9rie se retourne","Pas de stop global dans la version classique : c\u2019est le probl\xE8me"],"\u26A0\uFE0F RISQUE TR\xC8S \xC9LEV\xC9 \u2014 Martingale : quelques pertes de suite peuvent vider un compte. D\xE9conseill\xE9. Si tu l\u2019\xE9tudies, utilise un capital que tu peux perdre et un plafond strict."]],Jr=Tn.map((n,i)=>({id:`dv${i+1}`,name:n[0],category:n[1],tag:n[1],timeframe:n[2],winRate:n[3],rr:n[4],desc:n[5],entryPoints:n[6],exitDetail:n[7],warning:n[8]||void 0,entryRules:n[6].join(" \u2022 "),exitRules:n[7],trades:42+i*17%110,profit:920+i*191%2300})),fs=[...Jr,...An.map((n,i)=>({id:`st${i+1}`,name:n[0],category:n[1],tag:n[1],timeframe:n[2],winRate:n[3],rr:n[4],desc:n[5],entryPoints:n[6],exitDetail:n[7],warning:n[8]||void 0,entryRules:n[6].join(" \u2022 "),exitRules:n[7],trades:40+i*13%120,profit:800+i*173%2400}))],En=["DERIV - Indices Synth\xE9tiques","Scalping","Day Trading","Smart Money / ICT","Price Action","Indicateurs","Avanc\xE9"],Ns=["EUR/USD","GBP/USD","USD/JPY"],hs=[{id:"bg1",name:"Suivre la tendance - La plus simple",category:"D\xE9butant",tag:"D\xE9butant",timeframe:"H1",winRate:60,rr:"1 : 2",trades:42,profit:640,desc:"Si \xE7a monte, tu ach\xE8tes. Si \xE7a descend, tu vends. Tu suis le mouvement, tu ne devines pas le retournement.",entryPoints:["Regarde le graphique : est-ce que le prix monte ou descend en g\xE9n\xE9ral ?","Attends un petit retour en arri\xE8re, comme une respiration.","Tu entres dans le sens de la grande direction."],exitDetail:"TP \xE0 2R ou sur le niveau suivant. SL derri\xE8re le petit retour. Risque 1 %.",entryRules:"Suis la tendance",exitRules:"TP \xE0 2R, SL derri\xE8re le retour"},{id:"bg2",name:"Support & R\xE9sistance - Facile",category:"D\xE9butant",tag:"D\xE9butant",timeframe:"H1",winRate:58,rr:"1 : 2",trades:38,profit:520,desc:"Quand le prix touche le bas, \xE7a rebondit souvent. Quand il touche le haut, \xE7a redescend souvent. Tu attends le rebond.",entryPoints:["Rep\xE8re le bas (support) et le haut (r\xE9sistance) que le prix a d\xE9j\xE0 touch\xE9s 2 fois.","Attends que le prix revienne toucher le bas ou le haut.","Tu entres seulement si tu vois un petit rebond. "],exitDetail:"TP sur le c\xF4t\xE9 oppos\xE9. SL juste derri\xE8re le niveau touch\xE9. Risque 1 %.",entryRules:"Attends le rebond sur le niveau",exitRules:"TP oppos\xE9, SL derri\xE8re le niveau"},{id:"bg3",name:"Cassure - Breakout simple",category:"D\xE9butant",tag:"D\xE9butant",timeframe:"M15 / H1",winRate:56,rr:"1 : 2",trades:31,profit:480,desc:"Quand le prix casse une ligne qu\u2019il n\u2019arrivait pas \xE0 d\xE9passer, il peut continuer fort. Tu entres apr\xE8s la cassure.",entryPoints:["Trace la ligne que le prix n\u2019arrive pas \xE0 casser.","Attends une bougie qui cl\xF4ture vraiment au-del\xE0 de la ligne.","Tu entres sur le petit retest, pas au milieu de nulle part."],exitDetail:"TP \xE0 2R. SL \xE0 l\u2019int\xE9rieur, derri\xE8re la ligne cass\xE9e. Pas d\u2019entr\xE9e sans cassure nette.",entryRules:"Attends la cassure + retest",exitRules:"TP 2R, SL derri\xE8re la ligne"}],Ln={bg1:{videoText:"Imagine une route qui monte. Tu marches dans le m\xEAme sens que la route. Tu ne remontes pas la pente \xE0 contre-sens. En 2 minutes : 1) tu regardes si \xE7a monte ou descend, 2) tu attends un petit retour, 3) tu entres dans le m\xEAme sens.",drawn:["\u2197  \u2197  \u2197  Le prix monte \u2192 on pense ACHAT","\u2198  Petite pause, petit retour","\u2197  Reprise \u2192 entr\xE9e possible, avec SL derri\xE8re la pause"],demo:"Sur Deriv d\xE9mo, ouvre EUR/USD en H1, rep\xE8re la direction, puis note ton trade dans le journal."},bg2:{videoText:"Imagine une balle qui rebondit sur le sol. Le sol, c\u2019est le support. Le plafond, c\u2019est la r\xE9sistance. Tu n\u2019attrapes pas la balle au milieu : tu attends qu\u2019elle touche le sol ou le plafond.",drawn:["\u2501\u2501\u2501\u2501 Plafond (r\xE9sistance) : le prix redescend souvent","\u2195  Le prix bouge entre les deux lignes","\u2501\u2501\u2501\u2501 Sol (support) : le prix rebondit souvent"],demo:"Sur Deriv d\xE9mo, trace 2 lignes sur EUR/USD, attends le rebond, puis note ton id\xE9e dans le journal."},bg3:{videoText:"Imagine un mur que le prix n\u2019arrive pas \xE0 traverser. Un jour, il le traverse vraiment. \xC7a veut dire que la force a chang\xE9. Tu entres apr\xE8s la travers\xE9e, pas avant.",drawn:["\u2501\u2501\u2501\u2501 Mur : le prix tape 2 fois sans passer","\u279C  Cassure : une bougie cl\xF4ture au-del\xE0","\u21A9  Petit retour sur le mur \u2192 entr\xE9e possible"],demo:"Sur Deriv d\xE9mo, attends une vraie cassure sur EUR/USD en M15, puis note ton trade dans le journal."}},X=[{title:"C\u2019est quoi le Forex ?",body:"Tu \xE9changes une monnaie contre une autre, comme 1 \u20AC = 1,08 $. Si le prix monte apr\xE8s ton achat, tu gagnes. Si le prix descend, tu perds un peu. C\u2019est tout. Pas besoin de tout savoir pour commencer.",example:"1 \u20AC = 1,08 $. Tu ach\xE8tes \xE0 1,08 $. Le prix monte \xE0 1,09 $. Tu as gagn\xE9 la diff\xE9rence.",tip:"Malembe malembe : doucement doucement. On apprend une chose \xE0 la fois."},{title:"C\u2019est quoi une paire ?",body:"Une paire, ce sont 2 monnaies coll\xE9es. EUR/USD = Euro contre Dollar. Le premier chiffre dit combien vaut 1 euro en dollars. Tu ne trades jamais une monnaie seule, toujours une paire.",example:"EUR/USD \xE0 1,0842 : 1 euro vaut 1,0842 dollar. Si EUR/USD monte, l\u2019euro devient plus fort que le dollar.",tip:"En mode D\xE9butant, on commence avec 3 paires seulement : EUR/USD, GBP/USD et USD/JPY."},{title:"C\u2019est quoi un pip, un lot, un levier ?",body:"Pip = le plus petit mouvement du prix. Pour EUR/USD, 1 pip = 0,0001. Lot = la taille de ton trade. 0,01 lot, c\u2019est la plus petite taille : parfait pour d\xE9buter. Levier = un amplificateur. Il amplifie les gains\u2026 et les pertes. En d\xE9mo, on reste petit.",example:"Capital 1 000 $. Risque 1 % = 10 $. Avec 0,01 lot, un mouvement de 10 pips ne fait bouger que quelques centimes : tu apprends sans stress.",tip:"Retiens : petit lot + petit risque = tu peux apprendre longtemps."},{title:"Acheter ou Vendre ?",body:"C\u2019est la seule question. Si tu penses que \xE7a va monter, tu ACHETES. Si tu penses que \xE7a va descendre, tu VENDS. Tu n\u2019as pas besoin d\u2019avoir raison tout le temps, tu as besoin d\u2019un plan.",example:"Tu penses que l\u2019euro va monter ? ACHAT sur EUR/USD. Tu penses que l\u2019euro va baisser ? VENTE sur EUR/USD.",tip:"Ozali kolanda bien ! Tu suis bien. Continue comme \xE7a."},{title:"C\u2019est quoi TP et SL ?",body:"TP (Take Profit) = l\xE0 o\xF9 tu prends ton b\xE9n\xE9fice. Tu d\xE9cides avant d\u2019entrer : \xAB je sors ici si \xE7a marche \xBB. SL (Stop Loss) = l\xE0 o\xF9 tu coupes ta perte pour te prot\xE9ger. Tu le places AVANT d\u2019entrer, et tu ne le d\xE9places pas par \xE9motion.",example:"Tu ach\xE8tes \xE0 1,0842. TP \xE0 1,0882 (tu gagnes). SL \xE0 1,0802 (tu perds un petit montant pr\xE9vu). Le SL te prot\xE8ge.",tip:"Un trade sans SL, c\u2019est comme traverser sans regarder. On met toujours un SL."},{title:"La r\xE8gle d\u2019or : 1 % maximum",body:"Ne risque jamais plus de 1 % de ton argent par trade. Si tu as 1 000 $, tu risques 10 $ maximum par trade. M\xEAme si tu te trompes 5 fois, tu es encore l\xE0 pour apprendre. C\u2019est \xE7a qui fait durer un trader.",example:"Capital 1 000 $ \u2192 risque max 10 $ par trade. Capital 500 $ \u2192 risque max 5 $ par trade.",tip:"Cette r\xE8gle te prot\xE8ge. Elle est plus importante que n\u2019importe quelle strat\xE9gie."},{title:"Ton premier trade d\xE9mo sur Deriv",body:"On ne trade jamais en r\xE9el tant qu\u2019on n\u2019a pas gagn\xE9 1 mois en d\xE9mo. Voici ton premier trade, pas \xE0 pas, sans stress.",example:"1. Ouvre un compte d\xE9mo Deriv. 2. Choisis EUR/USD. 3. Mets 0,01 lot. 4. Mets ton SL et ton TP avant de valider. 5. Note ton trade dans le journal, gagnant ou perdant.",tip:"Bravo d\u2019\xEAtre arriv\xE9 ici. Le plus dur, c\u2019est de commencer. Tu l\u2019as fait."}],Or=[{q:"C\u2019est quoi un pip ?",options:["Le plus petit mouvement du prix","Une monnaie","Un type de compte"],answer:0},{q:"Tu penses que EUR/USD va monter. Tu fais quoi ?",options:["Tu VENDS","Tu ACHETES","Tu fermes l\u2019application"],answer:1},{q:"C\u2019est quoi le SL ?",options:["L\xE0 o\xF9 tu prends ton b\xE9n\xE9fice","L\xE0 o\xF9 tu coupes ta perte pour te prot\xE9ger","Le nom d\u2019une paire"],answer:1},{q:"Combien tu risques au maximum par trade ?",options:["Tout ton argent","10 % par trade","1 % de ton argent"],answer:2},{q:"Quand peux-tu passer en argent r\xE9el ?",options:["Tout de suite","Apr\xE8s avoir gagn\xE9 1 mois en d\xE9mo","Quand un ami te le dit"],answer:1}],Vr=[{term:"Pip",def:"Le plus petit mouvement du prix. Pour EUR/USD, 1 pip = 0,0001. C\u2019est comme la plus petite marche d\u2019un escalier."},{term:"Lot",def:"La taille de ton trade. 0,01 lot = la plus petite taille, parfaite pour d\xE9buter en d\xE9mo."},{term:"Levier",def:"Un amplificateur. Il rend les gains plus grands, mais aussi les pertes plus grandes. On reste petit au d\xE9but."},{term:"Spread",def:"La petite diff\xE9rence entre le prix d\u2019achat et le prix de vente. C\u2019est le co\xFBt de ton trade."},{term:"Marge",def:"L\u2019argent que ton broker bloque pendant que ton trade est ouvert. Il te le rend quand tu fermes le trade."},{term:"TP (Take Profit)",def:"L\xE0 o\xF9 tu prends ton b\xE9n\xE9fice. Tu le choisis avant d\u2019entrer."},{term:"SL (Stop Loss)",def:"L\xE0 o\xF9 tu coupes ta perte pour te prot\xE9ger. Tu le places avant d\u2019entrer."},{term:"Tendance",def:"La direction g\xE9n\xE9rale du prix : \xE7a monte, \xE7a descend, ou \xE7a reste \xE0 plat."},{term:"Support",def:"Un niveau en bas o\xF9 le prix rebondit souvent, comme le sol pour une balle."},{term:"R\xE9sistance",def:"Un niveau en haut o\xF9 le prix redescend souvent, comme un plafond."},{term:"Broker",def:"La plateforme qui te permet de trader. Ici, c\u2019est Deriv. Tu trades en d\xE9mo d\u2019abord."},{term:"D\xE9mo",def:"Un compte avec de l\u2019argent fictif pour apprendre sans risque. C\u2019est l\xE0 qu\u2019on commence."},{term:"Cassure (Breakout)",def:"Quand le prix traverse enfin une ligne qu\u2019il n\u2019arrivait pas \xE0 d\xE9passer."},{term:"Bougie (Chandelier)",def:"Un petit dessin qui montre comment le prix a boug\xE9 pendant une p\xE9riode."}],Pn={Pip:"Le plus petit mouvement du prix. Pour EUR/USD, 1 pip = 0,0001.",Lot:"La taille de ton trade. 0,01 lot = la plus petite taille, parfaite pour d\xE9buter.",Levier:"Un amplificateur : il rend les gains plus grands, mais aussi les pertes.",TP:"Take Profit : l\xE0 o\xF9 tu prends ton b\xE9n\xE9fice.",SL:"Stop Loss : l\xE0 o\xF9 tu coupes ta perte pour te prot\xE9ger.",Spread:"La petite diff\xE9rence entre le prix d\u2019achat et le prix de vente.",Tendance:"La direction g\xE9n\xE9rale : \xE7a monte, \xE7a descend, ou \xE7a reste \xE0 plat.",Support:"Un niveau en bas o\xF9 le prix rebondit souvent.",R\u00E9sistance:"Un niveau en haut o\xF9 le prix redescend souvent.",Broker:"La plateforme qui te permet de trader. Ici, c\u2019est Deriv.",D\u00E9mo:"Un compte avec de l\u2019argent fictif pour apprendre sans risque.","R:R":"Le rapport entre ce que tu vises et ce que tu risques. 1:2 = tu vises 2 fois ce que tu risques."},He=[{id:"g1",title:"Les bases du Forex",cat:"D\xE9butant",time:"12 min",level:"D\xE9butant",intro:"Le Forex, c\u2019est l\u2019\xE9change d\u2019une devise contre une autre. On trade toujours une paire : la premi\xE8re s\u2019ach\xE8te, la seconde sert de r\xE9f\xE9rence. Le prix bouge en pips, et le levier amplifie les gains comme les pertes.",keys:["Une paire = deux devises, un prix, un sens","Le pip mesure le plus petit mouvement","Le lot d\xE9finit la taille de ta position","Le levier n\u2019est pas un gain, c\u2019est un amplificateur"],example:"EUR/USD \xE0 1,0842 : 1 euro vaut 1,0842 dollar. Si le prix monte \xE0 1,0942, il a gagn\xE9 100 pips.",checklist:["Je sais lire une paire","Je connais la valeur d\u2019un pip","Je choisis mon lot avant d\u2019entrer"]},{id:"g2",title:"Lire les chandeliers",cat:"Technique",time:"15 min",level:"D\xE9butant",intro:"Chaque chandelier raconte une bataille entre acheteurs et vendeurs sur une p\xE9riode. Le corps montre l\u2019\xE9cart ouverture-cl\xF4ture, les m\xE8ches montrent les extr\xEAmes test\xE9s.",keys:["Vert = cl\xF4ture au-dessus de l\u2019ouverture","Grande m\xE8che = rejet d\u2019un niveau","Un avalement signale un changement de force","Le contexte compte plus que la figure seule"],example:"Une longue m\xE8che haute sur une r\xE9sistance = les acheteurs ont pouss\xE9, puis ont \xE9t\xE9 repouss\xE9s. Prudence avant d\u2019acheter.",checklist:["Je rep\xE8re ouverture / cl\xF4ture / m\xE8ches","Je lis le rejet, pas seulement la couleur","Je confirme avec la structure"]},{id:"g3",title:"Support & R\xE9sistance",cat:"Technique",time:"14 min",level:"Interm\xE9diaire",intro:"Un support est une zone o\xF9 les acheteurs ont d\xE9j\xE0 d\xE9fendu le prix. Une r\xE9sistance est l\u2019inverse. Plus une zone est test\xE9e sans casser, plus elle est visible \u2014 et plus sa cassure peut \xEAtre forte.",keys:["Tracer des zones, pas des lignes parfaites","Attendre le retest apr\xE8s cassure","Un ancien support devient r\xE9sistance","Fusionner avec le timeframe sup\xE9rieur"],example:"EUR/USD rebondit 3 fois sur 1,0800 : c\u2019est une zone. Une cassure nette + retest sous la zone valide un biais vendeur.",checklist:["J\u2019ai trac\xE9 mes zones H1","J\u2019attends le retest","Je place mon stop derri\xE8re la zone"]},{id:"g4",title:"Smart Money Concepts",cat:"Avanc\xE9",time:"22 min",level:"Avanc\xE9",intro:"SMC cherche \xE0 suivre les traces des gros acteurs : liquidit\xE9, blocs d\u2019ordres, Fair Value Gaps et changement de caract\xE8re. Ce n\u2019est pas magique, c\u2019est de la lecture de structure.",keys:["La liquidit\xE9 attire le prix","L\u2019Order Block marque une d\xE9cision","Le FVG est un d\xE9s\xE9quilibre \xE0 combler","Le CHoCH signale un possible retournement"],example:"Le prix prend la liquidit\xE9 sous un plus bas, puis cl\xF4ture au-dessus d\u2019un FVG : les acheteurs reprennent la main.",checklist:["J\u2019ai identifi\xE9 la structure H1","Je rep\xE8re le FVG et l\u2019OB","Je n\u2019entre qu\u2019apr\xE8s confirmation"]},{id:"g5",title:"Gestion du risque",cat:"Essentiel",time:"18 min",level:"Essentiel",intro:"La gestion du risque est ce qui s\xE9pare un trader qui dure d\u2019un compte qui dispara\xEEt. On ne risque jamais plus qu\u2019un petit pourcentage du capital par trade, et on accepte la perte avant d\u2019entrer.",keys:["Risquer 1 % par trade, pas 10 %","Le stop-loss se place avant l\u2019entr\xE9e","La taille de lot d\xE9coule du risque","Un trade perdu ne se \xAB r\xE9cup\xE8re \xBB pas"],example:"Capital 10 000 $, risque 1 % = 100 $. Si le stop est \xE0 20 pips, la taille de lot doit faire perdre 100 $ si le stop est touch\xE9.",checklist:["Mon risque est \xE9crit avant l\u2019entr\xE9e","Mon stop est plac\xE9","Je ne d\xE9place pas mon stop par \xE9motion"]},{id:"g6",title:"Psychologie du trader",cat:"Mindset",time:"16 min",level:"Essentiel",intro:"Le march\xE9 teste la patience plus que l\u2019intelligence. FOMO, revanche et exc\xE8s de confiance cr\xE9ent les plus grosses pertes. Un plan \xE9crit prot\xE8ge des d\xE9cisions impulsives.",keys:["Pas de trade hors plan","Apr\xE8s 2 pertes, pause obligatoire","Le journal r\xE9v\xE8le tes vrais sch\xE9mas","La discipline bat la pr\xE9diction"],example:"Tu rates un signal parfait ? Le march\xE9 en donnera un autre. Courir apr\xE8s un trade, c\u2019est payer le prix de l\u2019impatience.",checklist:["J\u2019ai un plan \xE9crit","Je note mes \xE9motions","Je respecte ma pause"]},{id:"g7",title:"Comment utiliser les signaux",cat:"Pratique",time:"10 min",level:"D\xE9butant",intro:"Un signal est une id\xE9e, pas une garantie. V\xE9rifie toujours qu\u2019il colle \xE0 ta strat\xE9gie, \xE0 ton horaire et \xE0 ton risque avant de le suivre. Ne copie jamais aveugl\xE9ment.",keys:["V\xE9rifier la confluence avec ta strat\xE9gie","Adapter la taille \xE0 ton capital","Respecter le SL du signal","Noter le r\xE9sultat dans le journal"],example:"Signal ACHAT V75, confiance 84 %, TP1 143 800. Tu v\xE9rifies la structure M5, tu risques 1 %, tu suis le plan jusqu\u2019au bout.",checklist:["Le signal colle \xE0 ma strat\xE9gie","Mon risque est calcul\xE9","Je note le trade dans le journal"]}],Gr=[{id:"off-forex",title:"C\u2019est quoi le Forex ?",emoji:"\u{1F4B1}",intro:"Le Forex, c\u2019est l\u2019\xE9change d\u2019une monnaie contre une autre. Tu ach\xE8tes une paire comme EUR/USD : 1 euro vaut, par exemple, 1,08 dollar. Si le prix monte apr\xE8s ton achat, tu gagnes la diff\xE9rence. Si le prix descend, tu perds un petit montant pr\xE9vu.",points:["Une paire = 2 monnaies, un prix, un sens : acheter ou vendre.","Le prix bouge en pips, le plus petit mouvement.","On commence toujours en d\xE9mo, avec de l\u2019argent fictif.","On ne trade jamais avec de l\u2019argent dont on a besoin."],example:"EUR/USD \xE0 1,0842 : 1 euro vaut 1,0842 dollar. Si le prix monte \xE0 1,0942, il a gagn\xE9 100 pips.",tip:"Malembe malembe : doucement doucement. Une notion \xE0 la fois."},{id:"off-pip",title:"C\u2019est quoi un pip ?",emoji:"\u{1F4CF}",intro:"Le pip, c\u2019est la plus petite marche du prix. Pour EUR/USD, 1 pip = 0,0001. C\u2019est l\u2019unit\xE9 qui te dit de combien le prix a boug\xE9. Tu n\u2019as pas besoin de calculer vite : le calculateur et le journal le font pour toi.",points:["EUR/USD : 1 pip = 0,0001.","Le pip mesure le mouvement, pas ton gain tout seul.","La valeur d\u2019un pip d\xE9pend de ta taille de position (lot).","Petit lot = petit mouvement en argent. Parfait pour apprendre."],example:"EUR/USD passe de 1,0842 \xE0 1,0852 : il a boug\xE9 de 10 pips.",tip:"Retiens : pip = mouvement, lot = taille, risque = ce que tu acceptes de perdre."},{id:"off-lot",title:"C\u2019est quoi un lot ?",emoji:"\u{1F4E6}",intro:"Le lot, c\u2019est la taille de ton trade. 0,01 lot, c\u2019est la plus petite taille : c\u2019est celle qu\u2019on utilise pour d\xE9buter. Plus le lot est grand, plus chaque pip fait bouger ton argent \u2014 dans les deux sens.",points:["0,01 lot = la plus petite taille, parfaite pour d\xE9buter.","On choisit le lot AVANT d\u2019entrer, avec le calculateur.","On ne monte jamais le lot pour \xAB se refaire \xBB apr\xE8s une perte.","En d\xE9mo, on s\u2019entra\xEEne avec 0,01 lot jusqu\u2019\xE0 \xEAtre \xE0 l\u2019aise."],example:"Avec 0,01 lot, un mouvement de 10 pips ne fait bouger que quelques centimes : tu apprends sans stress.",tip:"Petit lot + petit risque = tu peux apprendre longtemps."},{id:"off-levier",title:"C\u2019est quoi le levier ?",emoji:"\u{1F50D}",intro:"Le levier, c\u2019est un amplificateur. Il rend les gains plus grands, mais aussi les pertes plus grandes. Ce n\u2019est pas un cadeau : c\u2019est un outil \xE0 utiliser petit, surtout au d\xE9but.",points:["Levier 1:100 ne veut pas dire \xAB 100 fois plus de gains garantis \xBB.","Il amplifie le r\xE9sultat, bon ou mauvais.","En d\xE9butant, on reste avec un levier modeste et un petit lot.","La vraie protection, c\u2019est ton stop-loss et ton risque de 1 %."],example:"Avec un levier \xE9lev\xE9 et un gros lot, une petite erreur peut co\xFBter tr\xE8s cher. Avec un petit lot, la m\xEAme erreur co\xFBte tr\xE8s peu.",tip:"Le levier ne te prot\xE8ge pas. Ton plan, si."},{id:"off-support",title:"C\u2019est quoi un support ?",emoji:"\u{1F9F1}",intro:"Un support, c\u2019est un sol : un niveau en bas o\xF9 le prix a d\xE9j\xE0 rebondi plusieurs fois. Une r\xE9sistance, c\u2019est un plafond : un niveau en haut o\xF9 le prix redescend souvent. On trade le rebond, jamais au milieu de nulle part.",points:["Support = sol : le prix rebondit souvent dessus.","R\xE9sistance = plafond : le prix redescend souvent dessous.","Plus un niveau est test\xE9 sans casser, plus il est visible.","On place souvent son stop-loss juste derri\xE8re le niveau."],example:"EUR/USD rebondit 3 fois sur 1,0800 : c\u2019est un support. Une cassure nette sous ce niveau change le plan.",tip:"On trace des zones, pas des lignes parfaites au millim\xE8tre."},{id:"off-tendance",title:"C\u2019est quoi une tendance ?",emoji:"\u{1F4C8}",intro:"La tendance, c\u2019est la direction g\xE9n\xE9rale : \xE7a monte, \xE7a descend, ou \xE7a reste \xE0 plat (range). Si \xE7a monte, on cherche \xE0 acheter. Si \xE7a descend, on cherche \xE0 vendre. On suit le mouvement, on ne devine pas le retournement.",points:["Hausse : hauts et bas de plus en plus hauts.","Baisse : hauts et bas de plus en plus bas.","Range : le prix bouge entre un sol et un plafond.","En range, on attend \u2014 ou on trade les bords avec prudence."],example:"Le prix monte depuis c
